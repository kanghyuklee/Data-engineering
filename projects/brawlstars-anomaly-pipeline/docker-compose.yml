# 로컬 개발용 스택 (Kafka · PostgreSQL · Spark · Airflow)
# 전부 띄우면 무거우니, 처음엔 kafka + postgres만 올리고 시작하는 걸 추천.
#   docker compose up -d kafka postgres
# 메모리는 Docker에 8GB 이상 할당하세요.

services:
  # ---------- Kafka (KRaft 모드, 단일 브로커) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 2개: 호스트(내 PC)용 localhost:9092 + 컨테이너 내부용 kafka:29092
      #   - producer.py(호스트 실행)        → localhost:9092
      #   - Spark 컨테이너(preprocess.py)    → kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"   # 스켈레톤 편의용. 운영에선 끄고 명시 생성
      # TODO: bs.battles 토픽을 명시 생성하며 파티션 수 지정 (player_tag 분배용), bs.dlq도

  # ---------- PostgreSQL (탐지 결과 저장 + Airflow 메타DB) ----------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brawl
      POSTGRES_PASSWORD: brawl       # TODO: .env로 빼기
      POSTGRES_DB: brawlstars
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # ---------- Spark (preprocess.py 실행 — Kafka에서 읽어 전처리·저장) ----------
  # bitnami/spark는 2025년 Docker Hub에서 내려가서 공식 apache/spark 이미지 사용.
  spark:
    image: apache/spark:3.5.3
    container_name: spark
    depends_on:
      - kafka
      - postgres
    volumes:
      - .:/app        # 프로젝트를 /app으로 마운트 (preprocess.py 실행, data/parquet 저장)
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]   # 컨테이너를 켜둔 채 유지 → exec로 spark-submit 실행
    # 실행 (Java/pyspark 로컬 설치 불필요 — 컨테이너 안에서 실행):
    #   docker compose exec spark /opt/spark/bin/spark-submit --master "local[*]" \
    #     --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.3 \
    #     /app/preprocess.py

  # ---------- Airflow (standalone. 운영 설계는 5회차에) ----------
  airflow:
    image: apache/airflow:2.9.2
    container_name: airflow
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://brawl:brawl@postgres/brawlstars
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8081:8080"   # Airflow 웹 UI
    volumes:
      - ./dag.py:/opt/airflow/dags/dag.py:ro
    command: standalone

  # ---------- Grafana (모니터링 대시보드 + 알림) ----------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"   # Grafana 웹 UI (admin / admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # TODO: .env로 빼기
    volumes:
      - grafana-data:/var/lib/grafana
    # 데이터 소스 설정은 UI에서:
    #   - PostgreSQL(brawlstars) → 탐지 결과·집계 지표 패널
    #   - (TODO) Prometheus → Kafka consumer lag·Spark 처리량 등 시스템 지표
    #     (kafka-exporter / spark metrics + prometheus 컨테이너 추가 필요)

volumes:
  pgdata:
  grafana-data:
